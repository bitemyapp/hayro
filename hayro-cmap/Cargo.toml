[package]
name = "hayro-cmap"
version = "0.1.0"
description = "A parser for CMap files."
authors = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
repository = { workspace = true }
license = { workspace = true }

[features]
default = ["embed-cmaps"]
std = []
# Embed the 65 predefined cmaps into the binary, as tables searched in place. Adds about
# 1.7 MB of data.
embed-cmaps = ["std"]

[dependencies]
hayro-postscript = { workspace = true }
smallvec = { workspace = true }

[lints]
workspace = true
