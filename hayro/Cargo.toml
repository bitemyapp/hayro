[package]
name = "hayro"
version = "0.8.0"
description = "A rasterizer for PDF files."
edition = { workspace = true }
rust-version = { workspace = true }
authors = { workspace = true }
repository = { workspace = true }
license = { workspace = true }
readme = "README.md"

[dependencies]
hayro-interpret = { workspace = true }
kurbo = { workspace = true }
image = { workspace = true, features = ["png"] }
bytemuck = { workspace = true, features = ["bytemuck_derive"] }
vello_cpu = { workspace = true }
# We don't use `rdm` because it causes larger discrepancies between platforms.
pic-scale = { workspace = true, features = ["neon", "sse", "avx"] }
rustc-hash = { workspace = true }
fearless_simd = { workspace = true }

[features]
default = ["embed-fonts", "embed-cmaps"]
embed-fonts = ["hayro-interpret/embed-fonts"]
# Embed the 65 predefined cmaps into the binary, as tables searched in place. Adds about
# 1.7 MB of data.
embed-cmaps = ["hayro-interpret/embed-cmaps"]

[lints]
workspace = true
