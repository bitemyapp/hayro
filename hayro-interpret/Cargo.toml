[package]
name = "hayro-interpret"
version = "0.8.0"
description = "A crate for interpreting PDF files."
edition = { workspace = true }
rust-version = { workspace = true }
authors = { workspace = true }
repository = { workspace = true }
license = { workspace = true }
readme = "README.md"

[dependencies]
hayro-cmap = { workspace = true }
hayro-syntax = { workspace = true, features = ["std", "images", "unsafe"] }
kurbo = { workspace = true }
smallvec = { workspace = true }
moxcms = { workspace = true, features = ["in_place"] }
phf = { workspace = true, features = ["macros"] }
skrifa = { workspace = true }
yoke = { workspace = true, features = ["derive"]}
siphasher = { workspace = true }
bitflags = { workspace = true }
rustc-hash = { workspace = true }

[dev-dependencies]
image = { workspace = true, features = ["png"] }

[features]
default = ["embed-fonts", "embed-cmaps"]
# Embed a light-weight set of fonts (around 240KB) that can be used as a substitute for the 14 PDF standard fonts.
embed-fonts = []
# Embed the 65 predefined cmaps into the binary, as tables searched in place. Adds about
# 1.7 MB of data.
embed-cmaps = ["hayro-cmap/embed-cmaps"]

[lints]
workspace = true
